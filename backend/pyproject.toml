[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "muhammadsirajdev", email = "FA23-BCS-077@ISBSTUDENT.COMSATS.EDU.PK" }
]
requires-python = ">=3.12"
dependencies = [
    "airportsdata==20260315",
    "chromadb==1.5.9",
    "fastapi==0.136.3",
    "jinja2==3.1.6",
    "langchain==1.3.2",
    "langchain-community==0.4.2",
    "langchain-groq==1.1.3",
    "langchain-mcp-adapters==0.3.0",
    "langchain-openai==1.7.1",
    "langchain-tavily==0.2.18",
    "langgraph==1.2.2",
    "langgraph-checkpoint-postgres==3.1.0",
    "mcp==1.28.1",
    "nest-asyncio==1.6.0",
    "psycopg-pool==3.3.1",
    "psycopg[binary]==3.3.4",
    "pycountry==26.2.16",
    "pydantic-settings==2.15.0",
    "pytest==9.1.1",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "tavily-python==0.7.24",
    "tiktoken==0.14.0",
    "uvicorn==0.48.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
